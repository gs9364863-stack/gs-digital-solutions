<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Digital Solutions - Live Clone</title>
    
    <!-- Google Fonts से पॉपिंस फॉन्ट जोड़ा गया है जो बिल्कुल इमेज जैसा दिखेगा -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* वैश्विक रीसेट और फॉन्ट सेटिंग्स */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 1. शीर्ष हेडर / नेविगेशन बार (Header Section) */
        .main-header {
            background-color: #001f3f; /* इमेज का गहरा नेवी ब्लू बैकग्राउंड */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            background: linear-gradient(135deg, #0056b3, #00bfff);
            color: #ffffff;
            font-weight: 700;
            font-size: 22px;
            padding: 5px 12px;
            border-radius: 4px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .logo-subtitle {
            font-size: 10px;
            color: #00bfff;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #00d2ff; /* सक्रिय मेनू के लिए लाइट ब्लू/सियान रंग */
        }

        .whatsapp-button {
            background-color: #0cc243; /* इमेज का व्हाट्सएप हरा रंग */
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(12, 194, 67, 0.2);
        }

        /* 2. मुख्य हीरो बैनर (Hero Section) */
        .hero-banner {
            background-color: #001f3f;
            padding: 60px 8% 80px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            position: relative;
        }

        .hero-content {
            max-width: 55%;
        }

        .info-tag {
            background: rgba(0, 191, 255, 0.15);
            color: #00bfff;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .hero-content h1 {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .hero-content p {
            color: #a0b2c6;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .btn-cyan {
            background-color: #00bfff;
            color: #001f3f;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* दाईं तरफ का लैपटॉप और स्क्रीन मॉकअप */
        .hero-display {
            position: relative;
            width: 45%;
            display: flex;
            justify-content: center;
        }

        .mockup-container {
            width: 100%;
            max-width: 460px;
            background: #0d0d0d;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* लैपटॉप के अंदर दिखने वाली स्क्रीन वेबसाइट */
        .mockup-screen {
            background: linear-gradient(140deg, #001122, #003366);
            border-radius: 6px;
            padding: 30px 20px;
            text-align: center;
            aspect-ratio: 16 / 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .mockup-screen::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0,191,255,0.3) 0%, transparent 70%);
            top: -20px;
            right: -20px;
        }

        .mockup-screen h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .mockup-screen p {
            font-size: 12px;
            color: #8da2bb;
            margin-bottom: 18px;
            max-width: 80%;
        }

        .mockup-btn {
            background-color: #00bfff;
            color: #ffffff;
            font-size: 11px;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
        }

        /* 3. नीचे का सेवाएं सेक्शन (Services Section) */
        .services-area {
            background-color: #ffffff;
            color: #333333;
            padding: 60px 8%;
        }

        .services-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .services-title-box h4 {
            color: #00bfff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .services-title-box h2 {
            font-size: 28px;
            color: #001f3f;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .services-title-box p {
            color: #777777;
            font-size: 14px;
        }

        .all-services-link {
            color: #00bfff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 5 कॉलम वाला ग्रिड लेआउट */
        .services-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .service-box {
            background-color: #ffffff;
            border: 1px solid #eef2f6;
            border-radius: 8px;
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .service-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        /* इमेज के अनुसार विभिन्न रंगों के आइकॉन बैकग्राउंड */
        .icon-wrapper {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
        }

        .icon-blue { background-color: #2b7fff; }
        .icon-pink { background-color: #ff4fa8; }
        .icon-green { background-color: #24d166; }
        .icon-orange { background-color: #ff9124; }
        .icon-purple { background-color: #9b51e0; }

        .service-box span {
            font-size: 14px;
            font-weight: 600;
            color: #222222;
            display: block;
        }

        /* रिस्पॉन्सिव सेटिंग्स (ताकि मोबाइल पर भी न बिगड़े) */
        @media (max-width: 992px) {
            .hero-banner { flex-direction: column; text-align: center; }
            .hero-content { max-width: 100%; }
            .hero-display { width: 100%; }
            .action-btns { justify-content: center; }
            .services-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 576px) {
            .services-row { grid-template-columns: 1fr; }
            .main-header { flex-direction: column; gap: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- 1. हेडर सेक्शन -->
    <header class="main-header">
        <div class="logo-area">
            <div class="logo-box">GS</div>
            <div class="logo-text">
