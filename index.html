<title>GS Digital Solutions | Your Digital Partner</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;color:#101b40;background:#f4f6ff;overflow-x:hidden}
a{text-decoration:none}
:root{--blue:#078cff;--purple:#6329ed;--navy:#071538}

header{
position:sticky;top:0;z-index:100;
background:rgba(5,17,51,.97);
padding:17px 5%;
display:flex;align-items:center;justify-content:space-between;
border-bottom:1px solid #ffffff25;
}
.logo{color:white;font-size:24px;font-weight:900}
.logo span{color:#20d8ff}
nav{display:flex;gap:24px}
nav a{color:white;font-size:14px;font-weight:bold}
nav a:hover{color:#25d8ff}
.nav-btn{background:#08ce65;color:white;padding:12px 20px;border-radius:30px;font-weight:bold}

.hero{
min-height:570px;
padding:65px 6%;
display:grid;
grid-template-columns:1fr 1.1fr;
align-items:center;
gap:30px;
position:relative;
background:linear-gradient(110deg,#fff 0%,#e9edff 55%,#d9e9ff 100%);
overflow:hidden;
}
.hero:before{
content:"";position:absolute;width:450px;height:450px;
background:#b9a4ff65;filter:blur(90px);
border-radius:50%;right:5%;top:0;
}
.hero-content,.visual{position:relative;z-index:2}
.pill{
display:inline-block;background:#fff;padding:11px 18px;
border-radius:30px;color:#4521c4;font-size:13px;font-weight:bold;
box-shadow:0 5px 20px #5555aa25;
}
h1{font-size:clamp(42px,5vw,68px);line-height:1.07;margin:22px 0 12px;letter-spacing:-2px}
.gradient{
background:linear-gradient(90deg,#078cf7,#7130e9);
background-clip:text;color:transparent;
}
.subtitle{font-size:22px;font-weight:bold;margin-bottom:15px}
.description{color:#4c5877;font-size:16px;line-height:1.8;max-width:510px}
.buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn{
display:inline-block;padding:15px 23px;margin-top:24px;
border-radius:35px;color:white;font-weight:bold;
background:linear-gradient(100deg,#4022ed,#078ff4);
box-shadow:0 8px 25px #4427dc50;
transition:.3s;
}
.btn:hover{transform:translateY(-3px)}
.btn-light{
display:inline-block;padding:14px 22px;margin-top:24px;
border:1px solid #203d7b;border-radius:35px;
color:#14264e;font-weight:bold;
}
.stats{
display:flex;gap:28px;flex-wrap:wrap;margin-top:30px;
}
.stats strong{display:block;color:#0877e9;font-size:21px}
.stats small{color:#59647e}

.visual{
height:370px;display:flex;
align-items:center;justify-content:center;
}
.laptop{
width:88%;height:260px;padding:11px;
background:#171e39;border:8px solid #303b5b;
border-radius:17px;position:relative;
box-shadow:0 28px 40px #1c275555;
transform:perspective(900px) rotateY(-7deg);
}
